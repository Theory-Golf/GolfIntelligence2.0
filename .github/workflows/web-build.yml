name: Web Build

on:
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web-build.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # Keeps styles/system.css the single source of truth for type,
      # colour, spacing, breakpoints and layering. Fails on a raw value
      # where a token exists; see scripts/check-formatting.mjs.
      - run: npm run check:formatting

      # Every text token must clear WCAG AA on every surface it can sit on.
      - run: npm run check:contrast

      - run: npm test

      - run: npm run build
